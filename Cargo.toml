[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "1.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ErykMajoch/isotrail"

[workspace.dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive", "env"] }
directories = "6.0.0"
geo = { version = "0.33.1", default-features = false }
gif = { version = "0.14.2", default-features = false, features = ["raii_no_panic", "std"] }
glam = "0.34.1"
miniz_oxide = "0.9.1"
png = "0.18.1"
pollster = "1.0.1"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
quick-xml = "0.42.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "gzip", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "fmt", "std"] }
tzf-rs = { version = "2.1.3", default-features = false, features = ["bundled"] }
wgpu = "30.0.1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
