[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ErykMajoch/isotrail"

[workspace.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap = { version = "4.6.7", features = ["derive"] }
quick-xml = "0.42.0"
thiserror = "2.0.21"
toml = "1.1.6"
tracing = "0.1.44"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
