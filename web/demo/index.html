<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>isotrail embed demo</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f1ea;
      --fg: #202e37;
      --muted: #577277;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #151d24;
        --fg: #ebede9;
        --muted: #a4dddb;
      }
    }
    body {
      margin: 0;
      padding: 24px 16px 48px;
      background: var(--bg);
      color: var(--fg);
      font: 15px/1.5 system-ui, sans-serif;
    }
    main {
      max-width: 960px;
      margin: 0 auto;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 4px;
    }
    h2 {
      font-size: 16px;
      margin: 32px 0 8px;
    }
    p {
      margin: 0 0 16px;
      color: var(--muted);
    }
    a {
      color: inherit;
    }
    isotrail-hike {
      border-radius: 6px;
    }
    .square {
      max-width: 420px;
    }
  </style>
  <script type="module" src="demo.js"></script>
  <script type="module" src="../isotrail-embed.js"></script>
</head>
<body>
  <main>
    <h1>isotrail embed demo</h1>
    <p>
      A synthetic hike in two <code>&lt;isotrail-hike&gt;</code> elements. Drag to turn it, pinch or hold
      Ctrl (⌘ on a Mac) and scroll to zoom, and press play to watch the route draw itself.
      <a id="backend" href="?backend=webgl">Try the WebGL2 fallback</a>
    </p>

    <h2>Wide, with a poster</h2>
    <isotrail-hike src="hike.itb" poster="hike.png" aspect="wide"></isotrail-hike>

    <h2>Square, playing on its own</h2>
    <div class="square">
      <isotrail-hike src="hike.itb" aspect="square" autoplay></isotrail-hike>
    </div>
  </main>
</body>
</html>
