name: Site

# Deploys the web app to Cloudflare Pages, only when run by hand
on:
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [preview, production]
        default: preview

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  deploy:
    name: deploy (${{ inputs.target }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: wasm-pack@0.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install the site's packages
        working-directory: site
        run: npm ci

      - name: Build
        run: sh site/build.sh

      # The project's production branch is main. Any other branch name is a preview
      - name: Upload to Cloudflare Pages
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET: ${{ inputs.target }}
        run: |
          branch=preview
          if [ "$TARGET" = production ]; then branch=main; fi
          npx wrangler pages deploy dist --project-name isotrail --branch "$branch" \
            --commit-hash "$GITHUB_SHA" --commit-message "$GITHUB_REF_NAME $GITHUB_SHA"
