name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The same checks as CI, so a tag on a broken commit publishes nothing
  checks:
    name: checks
    runs-on: ubuntu-latest
    env:
      ISOTRAIL_GPU: software
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install software Vulkan driver and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers ffmpeg

      - name: Test
        run: cargo test --workspace

      - name: Check wasm32 build of the wasm-safe and web crates
        run: cargo clippy --target wasm32-unknown-unknown -p isotrail-track -p isotrail-bundle -p isotrail-render -p isotrail-web -- -D warnings

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2

      - name: cargo deny
        run: cargo deny check

  notices:
    name: third-party notices
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-about@0.9.3

      - name: Generate
        run: cargo about generate --locked --fail about.hbs -o THIRD-PARTY-NOTICES.md

      - uses: actions/upload-artifact@v7
        with:
          name: notices
          path: THIRD-PARTY-NOTICES.md
          if-no-files-found: error

  web:
    name: build web runtime
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: wasm-pack@0.15.0

      - name: Build
        run: |
          wasm-pack build crates/isotrail-web --target web --release --out-dir ../../web/pkg
          mkdir -p runtime/pkg
          cp web/isotrail-embed.js runtime/
          cp web/pkg/isotrail_web.js web/pkg/isotrail_web_bg.wasm runtime/pkg/

      - uses: actions/upload-artifact@v7
        with:
          name: web-runtime
          path: runtime/
          if-no-files-found: error

  build:
    name: build (${{ matrix.target }})
    needs: [web, notices]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p isotrail-cli

      - uses: actions/download-artifact@v8
        with:
          name: web-runtime
          path: runtime

      - uses: actions/download-artifact@v8
        with:
          name: notices

      - name: Package
        run: |
          name="isotrail-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name/assets"
          cp README.md LICENSE CHANGELOG.md THIRD-PARTY-NOTICES.md "dist/$name/"
          # Credits for the font and palettes built into the binary
          cp assets/README.md "dist/$name/assets/"
          # Next to the executable, where `isotrail embed --with-runtime` looks
          cp -r runtime "dist/$name/web"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "../target/${{ matrix.target }}/release/isotrail.exe" "$name/"
            7z a -tzip "$name.zip" "$name" > /dev/null
            sha256sum "$name.zip" > "$name.zip.sha256"
          else
            cp "../target/${{ matrix.target }}/release/isotrail" "$name/"
            tar -czf "$name.tar.gz" "$name"
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          rm -r "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: isotrail-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches crate version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -qx "version = \"$version\"" Cargo.toml; then
            echo "::error::$GITHUB_REF_NAME doesn't match the version in Cargo.toml"
            exit 1
          fi

      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { on = 1; next }
            on && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: isotrail-*
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "isotrail ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            --verify-tag
