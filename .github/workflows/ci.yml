name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      ISOTRAIL_GPU: ${{ matrix.os == 'macos-latest' && 'hardware' || 'software' }}
    steps:
      - uses: actions/checkout@v7

      # Installs the toolchain, components and targets pinned in rust-toolchain.toml
      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install software Vulkan driver
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers

      - name: Test
        run: cargo test --workspace

      - name: Upload golden-image failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures-${{ matrix.os }}
          path: target/golden-failures/
          if-no-files-found: ignore

      - name: Check wasm32 build of wasm-safe crates
        if: runner.os == 'Linux'
        run: cargo check --target wasm32-unknown-unknown -p isotrail-track -p isotrail-bundle -p isotrail-render
