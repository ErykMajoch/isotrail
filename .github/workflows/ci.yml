name: CI

on:
  # Tags go through the release workflow, which runs the same checks
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      ISOTRAIL_GPU: ${{ matrix.os == 'macos-latest' && 'hardware' || 'software' }}
    steps:
      - uses: actions/checkout@v7

      # Installs the toolchain, components and targets pinned in rust-toolchain.toml
      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # ffmpeg runs the MP4 tests, which pass with a note where it's missing
      - name: Install software Vulkan driver and ffmpeg
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers ffmpeg

      - name: Test
        run: cargo test --workspace

      - name: Upload golden-image failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures-${{ matrix.os }}
          path: target/golden-failures/
          if-no-files-found: ignore

      # Clippy rather than check, as the web crate's code only exists on wasm32
      - name: Check wasm32 build of the wasm-safe and web crates
        if: runner.os == 'Linux'
        run: cargo clippy --target wasm32-unknown-unknown -p isotrail-track -p isotrail-bundle -p isotrail-render -p isotrail-web -- -D warnings

  deny:
    name: dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2

      # Advisories, licences, duplicate versions and sources, as set in deny.toml
      - name: cargo deny
        run: cargo deny check

  web-runtime:
    name: web runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: wasm-pack@0.15.0

      - name: Build
        run: wasm-pack build crates/isotrail-web --target web --release --out-dir ../../web/pkg

      - name: Check the gzipped size is at most 3MB
        run: |
          total=0
          {
            echo "| File | Gzipped bytes |"
            echo "|---|---|"
            for file in web/isotrail-embed.js web/pkg/isotrail_web.js web/pkg/isotrail_web_bg.wasm; do
              size=$(gzip -9c "$file" | wc -c)
              total=$((total + size))
              echo "| \`$file\` | $size |"
            done
            echo "| **Total** | **$total** |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "The web runtime is $total bytes gzipped"
          if [ "$total" -gt 3000000 ]; then
            echo "::error::the web runtime is $total bytes gzipped, over the 3MB budget"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The check renders one still natively, through a software Vulkan driver
      - name: Install software Vulkan driver
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers

      # The runner has no GPU, so every embed is drawn on WebGL2 by SwiftShader
      - name: Browser check of the embed
        env:
          ISOTRAIL_GPU: software
        run: node web/test/check.mjs chrome --webgl
