[package]
name = "isotrail-web"
description = "WebAssembly entry point for the isotrail web embed"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
chrono.workspace = true
console_error_panic_hook.workspace = true
glam.workspace = true
isotrail-bundle = { path = "../isotrail-bundle" }
isotrail-render = { path = "../isotrail-render" }
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["HtmlCanvasElement", "console"] }
wgpu = { workspace = true, features = ["std", "webgpu", "webgl"] }

# `custom` is what wasm-pack reads for `--profile web`
[package.metadata.wasm-pack.profile.custom]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[lints]
workspace = true
